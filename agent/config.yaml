marketplace:
  mode: gigsim                 # gigsim | upwork_live   (env MARKETPLACE_MODE overrides)
  max_requests_per_minute: 20  # per-user limiter in the Marketplace MCP server (GigSim allows 60/token)
  timeout_s: 10
  max_retries: 3
  # Port method -> (tool, action) on the official Upwork MCP server, checked against its real tools/list
  # (docs/upwork_tools_list.json, 2026-11-14). A method with no entry fails loudly in live mode.
  # Deliberately NOT mapped: confirm_preview and send_message (GigBid never submits or sends on Upwork).
  upwork_tools:
    list_accounts: {tool: upwork__list_accounts}
    search_jobs: {tool: upwork__find_jobs, action: search}
    get_job: {tool: upwork__find_jobs, action: get}
    get_connects_balance: {tool: upwork__get_profile, action: connects_balance}
    list_messages: {tool: upwork__get_messages, action: list_rooms}
    read_messages: {tool: upwork__get_messages, action: list_messages}
    list_proposals: {tool: upwork__list_freelancer_proposals, action: list}
    create_proposal_draft: {tool: upwork__manage_proposals, action: create}   # returns a preview only

models:
  profile: open                # open | open_hosted | paid   (env MODEL_PROFILE overrides)
  providers:                   # all OpenAI-compatible endpoints
    ollama: {base_url: "http://localhost:11434/v1", api_key_env: OLLAMA_API_KEY}
    groq:   {base_url: "https://api.groq.com/openai/v1", api_key_env: GROQ_API_KEY}
    fake:   {base_url: "http://unused", api_key_env: NONE}
  # USD per 1M tokens (input, output), used for cost reporting. Local models cost 0 USD; we report
  # hardware + tokens/s for them instead. Check https://groq.com/pricing before quoting numbers.
  prices:
    "groq:openai/gpt-oss-20b": [0.075, 0.30]
    "groq:openai/gpt-oss-120b": [0.15, 0.60]
    "groq:qwen/qwen3.8-27b": [0.80, 4.00]     # console.groq.com/docs/models, checked 2026-11-14
  profiles:
    open:                      # required profile, fully local (RTX 4060 8 GB via Ollama)
      cheap:  {provider: ollama, model: "qwen3:4b-instruct"}
      strong: {provider: ollama, model: "qwen3:8b", think: false}
      fallback: {provider: ollama, model: "llama3.2"}
    open_alt:                  # second open configuration compared on the dev set (model choice by measurement)
      cheap:  {provider: ollama, model: "llama3.2"}
      strong: {provider: ollama, model: "qwen3:8b", think: false}
      fallback: {provider: ollama, model: "qwen3:4b-instruct"}
    test:                      # CI / Playwright only: scripted fake model (agent/testing/fake_llm.py)
      cheap:  {provider: fake, model: scripted}
      strong: {provider: fake, model: scripted}
      fallback: {provider: fake, model: scripted}
    open_hosted:               # deployed link: open-weight models through a hosted provider (no GPU on free hosts)
      cheap:  {provider: groq, model: "openai/gpt-oss-20b", reasoning_effort: low}
      strong: {provider: groq, model: "openai/gpt-oss-120b", reasoning_effort: low}
      fallback: {provider: groq, model: "qwen/qwen3.8-27b"}
  # Node -> tier. Cheap, frequent nodes use the small model; Writer, Critic, Liaison the strongest.
  nodes:
    scout: cheap
    analyst: cheap
    risk_assessor: cheap
    fit_matcher: cheap
    pricing: cheap
    intent: cheap
    compliance: cheap
    rag_rewrite: cheap
    claim_verifier: cheap
    writer: strong
    critic: strong
    client_liaison: strong
    judge: strong
  fallback_nodes: [scout, analyst, risk_assessor, fit_matcher, pricing, intent, compliance, rag_rewrite, claim_verifier]
  timeout_s: 120
  max_retries: 1

rag:
  variant: v0_naive            # set from evals/results/rag_variants.json (R6)
  embedding_model: nomic-ai/nomic-embed-text-v1.5
  reranker_model: jinaai/jina-reranker-v1-turbo-en   # bge-reranker-v2-m3 = 3.3-3.9 s per 20 docs on CPU
  corrective: {relevant: 0.0, weak: -3.0, max_rewrites: 1}

budgets:
  max_graph_steps: 30
  max_revisions: 2
  max_tokens_per_job: 40000   # declared token budget per job thread (R8)

thresholds:                    # decision node (agent/nodes/decide.py)
  minimum_fit_score: 0.33      # >= this -> bid; tuned on the dev sample (F1 0.73 -> 0.79 at 0.40 -> 0.33, decisions_open run 1)
  watch_fit_score: 0.15        # between watch and minimum -> watch, below -> skip
  maximum_risk_score: 0.70
  minimum_hourly_ratio: 0.6    # skip hourly jobs whose top rate is below 60% of my rate (user setting)

fit:
  evidence_per_requirement: 3

pricing:
  assumed_hours: 20            # hourly jobs: hours assumed for expected value
  fixed_fraction_of_budget: 0.9
  base_win_rate: 0.04
  fit_win_weight: 0.20
  hire_rate_weight: 0.10
  usd_per_connect: 0.15        # Upwork sells Connects at $0.15 each

tools:
  backend: inproc              # inproc (tests/evals) | http (docker compose, deploy); env MCP_BACKEND overrides
  timeout_s: 30
  max_retries: 2
  # Each node sees only these tools (server.tool). Compliance and the Analyst have no MCP access.
  allowlist:
    scout: [marketplace.search_jobs, marketplace.get_job, marketplace.get_policy]
    analyst: []
    risk_assessor: [marketplace.get_client_history]
    fit_matcher: [portfolio.search_evidence]
    pricing: [marketplace.get_market_stats, marketplace.get_connects_balance]
    writer: [portfolio.search_evidence, portfolio.get_evidence]
    verifier: [portfolio.get_evidence, portfolio.search_evidence]
    critic: [portfolio.get_evidence]
    compliance: []
    approval: [marketplace.create_proposal_draft]          # dry_run preview only
    submitter: [marketplace.create_proposal_draft, marketplace.submit_proposal]
    client_liaison: [marketplace.list_messages, marketplace.get_job, workspace.get_free_slots]
    liaison_sender: [marketplace.send_message, workspace.create_interview_hold, workspace.create_email_draft]
    api: [marketplace.list_proposals, marketplace.list_events, marketplace.list_messages,
          marketplace.marketplace_status, marketplace.get_connects_balance]
    # R&D question C baselines (evals/runners/study_c.py): read tools only; the harness submits after "approval"
    baseline_react: [marketplace.get_job, marketplace.get_client_history, marketplace.get_market_stats,
                     marketplace.get_policy, portfolio.search_evidence, portfolio.get_case_study]
    baseline_risk: [marketplace.get_client_history]
    baseline_fit: [portfolio.search_evidence]
    worker: [marketplace.list_events, marketplace.list_messages, marketplace.list_proposals,
             marketplace.marketplace_status, marketplace.get_connects_balance]

nodes:                         # per-node retries / timeouts (C7); unspecified nodes: 1 retry, 300 s
  intake: {retries: 1, timeout_s: 60}
  submitter: {retries: 0, timeout_s: 60}   # idempotency keys make a retried submit safe; the worker retries

risk:                          # Risk Assessor score = w_scam*scam_likelihood + w_client*(1-client_quality) + w_injection*injected
  w_scam: 0.65
  w_client: 0.25
  w_injection: 0.10
  high_flag_floor: 0.75        # a high-severity scam/off-platform/free-work flag forces at least this score
  scam_threshold: 0.6

simulator:                     # GigSim's clock (worker/tasks.py sim_clock); not used in live mode
  enabled: true
  publish_every_min: 60        # release this many new jobs from the live stream every hour
  publish_n: 5

agency:                        # X1 agency mode: route each job to the best-fit team member (agent/agency.py)
  members: [ai_ml, fullstack, data_analyst]
  min_fit_to_route: 0.2        # below this for every member -> no one is a fit; the job is skipped

memory:                        # promotion rules (agent/memory/promotion_rules.py)
  style_window: 5              # look at the last 5 edits ...
  style_min_support: 3         # ... a style signal must appear in at least 3 of them
  outcome_min_outcomes: 3      # per category, before any outcome lesson is promoted
