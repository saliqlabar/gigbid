[project]
name = "gigbid"
version = "1.0.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016 R&D assignment)"
requires-python = ">=3.11"
# Pinned direct dependencies (full lock: requirements.lock, generated with `uv pip compile`).
dependencies = [
  "fastapi==0.162.4", "uvicorn[standard]==0.54.0", "starlette==1.10.0", "pydantic==2.14.3",
  "pydantic-settings==2.16.2", "pyyaml==6.0.3", "python-dotenv==1.2.4", "python-multipart==0.0.33",
  "httpx==0.28.1", "sse-starlette==3.7.0",
  "langgraph==1.2.20", "langgraph-checkpoint==4.3.1", "langgraph-checkpoint-postgres==3.2.0",
  "langgraph-checkpoint-sqlite==3.1.3", "langgraph-prebuilt==1.1.1", "langgraph-supervisor==0.0.31",
  "langchain-core==1.7.7", "langchain-openai==1.7.4", "langchain-mcp-adapters==0.3.1", "mcp==1.30.0",
  "openai==3.49.0", "fastembed==0.9.1", "rank-bm25==0.2.2", "numpy==2.5.4", "pypdf==7.0.1",
  "cryptography==50.0.2", "psycopg[binary]==3.3.8", "psycopg-pool==3.3.3", "aiosqlite==0.22.1",
  "arq==0.28.0", "redis==5.3.1",
  "arize-phoenix-otel==0.17.3", "openinference-instrumentation-langchain==0.1.82",
  "openinference-instrumentation-openai==0.1.69",
]

[project.optional-dependencies]
data = ["pandas==3.1.1", "fpdf2==2.9.0"]          # dataset build scripts only
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4"]

[tool.ruff]
line-length = 120
extend-exclude = ["gigsim", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "B006"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]
