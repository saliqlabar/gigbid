name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    name: lint, repo rules, unit + integration + contract tests
    runs-on: ubuntu-latest
    env: {MODEL_PROFILE: test, MCP_BACKEND: inproc, PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock}
      - run: pip install -r requirements.lock
      - name: Lint
        run: ruff check .
      - name: Repo rules (no secrets, gigsim frozen, prompts in agent/prompts, README numbers traced)
        run: python scripts/ci/check_repo.py
      - name: Unit, integration and MCP contract (schema snapshot) tests
        run: pytest -q
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock}
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.lock
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx tsc -b && npx vite build
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: playwright-report, path: apps/web/playwright-report}
