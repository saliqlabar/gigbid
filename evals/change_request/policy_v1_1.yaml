# shipped the real one, was not in the starter kit). Served by GigSim unchanged, via GIGSIM_SEED_DIR pointing at a
# seed folder with this file as policy.yaml (evals/change_request/run.py builds it).
version: "1.1"
effective_from: "2026-11-02"
rules:
