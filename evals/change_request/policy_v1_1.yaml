  max_cover_letter_words: 300    # tightened from 400
  no_off_platform_contact: true
  no_guarantees: true
  no_unpaid_trials: true
  minimum_hourly_bid_usd: 10     # NEW RULE: hourly bids below $10/h are not allowed
