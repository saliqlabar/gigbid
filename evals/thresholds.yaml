# CI eval gate (.github/workflows/eval.yml). The smoke eval runs 30 dev jobs with the scripted test model,
# so these thresholds catch PIPELINE regressions (routing, rules, verification wiring), not model quality.
smoke:
  min_bid_f1: 0.65
  min_scam_recall: 0.8
  max_unsupported_claims_per_proposal: 0.5
  min_price_in_band: 0.8
